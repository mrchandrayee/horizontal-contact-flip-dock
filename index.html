<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05080e">
  <title>Horizontal Contact Flip Dock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Horizontal Contact Flip Dock</h1>

    <section class="demo-area" aria-label="Interactive contact dock">
      <nav class="contact-dock" aria-label="Social media and contact links">
        <a class="dock-item instagram" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <span class="flip-inner"><span class="front">C</span><span class="back"><span class="brand instagram-mark">◎</span></span></span>
          <span class="tooltip">Instagram</span>
        </a>
        <a class="dock-item facebook" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <span class="flip-inner"><span class="front">O</span><span class="back"><span class="brand facebook-mark">f</span></span></span>
          <span class="tooltip">Facebook</span>
        </a>
        <a class="dock-item linkedin" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <span class="flip-inner"><span class="front">N</span><span class="back"><span class="brand linkedin-mark">in</span></span></span>
          <span class="tooltip">LinkedIn</span>
        </a>
        <a class="dock-item youtube" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
          <span class="flip-inner"><span class="front">T</span><span class="back"><span class="brand youtube-mark">▶</span></span></span>
          <span class="tooltip">YouTube</span>
        </a>
        <a class="dock-item whatsapp" href="https://www.whatsapp.com/" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
          <span class="flip-inner"><span class="front">A</span><span class="back"><span class="brand whatsapp-mark">◉</span></span></span>
          <span class="tooltip">WhatsApp</span>
        </a>
        <a class="dock-item email" href="mailto:hello@example.com" aria-label="Email">
          <span class="flip-inner"><span class="front">C</span><span class="back"><span class="brand email-mark">✉</span></span></span>
          <span class="tooltip">Email</span>
        </a>
        <a class="dock-item twitter" href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X">
          <span class="flip-inner"><span class="front">T</span><span class="back"><span class="brand twitter-mark">𝕏</span></span></span>
          <span class="tooltip">Twitter</span>
        </a>
      </nav>
    </section>

    <p class="instruction">Comment "Flip" for code</p>
    <p class="hint">Hover or focus each letter to flip it into a contact icon.</p>
  </main>
</body>
</html>
